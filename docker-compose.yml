version: '3.8'

services:
  order-point:
    build: .
    container_name: order-point
    restart: always
    ports:
      - "5050:5050"
    volumes:
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.order-point.rule=Host(`zulinmonitor.traefik.me`)"
      - "traefik.http.routers.order-point.entrypoints=web"
      - "traefik.http.services.order-point.loadbalancer.server.port=5050"

networks:
  web:
    external: true
