version: '3.8'

services:
  order-point:
    build: .
    container_name: order-point
    restart: always
    ports:
      - "5050:5050"
      - "5900:5900"
      - "6080:6080"
    volumes:
      - ./config.json:/app/config.json
      - ./config.local.json:/app/config.local.json
      - ./records.db:/app/records.db
      - ./storage_state_order_scanner.json:/app/storage_state_order_scanner.json
    environment:
      - TZ=Asia/Shanghai
      - VNC_PASSWORD=vnc123
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.order-point.rule=Host(`zulinmonitor.traefik.me`)"
      - "traefik.http.routers.order-point.entrypoints=web"
      - "traefik.http.services.order-point.loadbalancer.server.port=5050"

networks:
  web:
    external: true