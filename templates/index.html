<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合管理控制台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-container {
            height: 400px;
            overflow-y: scroll;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            border-radius: 5px;
        }
        .status-dot {
            height: 15px;
            width: 15px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-running { background-color: #28a745; }
        .status-stopped { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <span class="fs-4">🛠️ 综合管理控制台</span>
            <div>
                <span class="text-muted small">系统时间: <span id="sys-time">--:--:--</span></span>
            </div>
        </header>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="order-tab" data-bs-toggle="tab" data-bs-target="#order" type="button" role="tab">📦 订单自动化</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="monitor-tab" data-bs-toggle="tab" data-bs-target="#monitor" type="button" role="tab">💰 接口余额监控</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="sync-tab" data-bs-toggle="tab" data-bs-target="#sync" type="button" role="tab">🔄 订单状态同步</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab">⚙️ 全局配置</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Order Automation Tab -->
            <div class="tab-pane fade show active" id="order" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="card shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title d-inline-block me-3">服务控制</h5>
                                    <div class="d-inline-block">
                                        <span id="order-status-dot" class="status-dot"></span>
                                        <span id="order-status-text" class="fw-bold text-muted">未知状态</span>
                                    </div>
                                </div>
                                <div class="btn-group" role="group">
                                    <button onclick="controlService('/api/control', 'start')" class="btn btn-success">启动服务</button>
                                    <button onclick="controlService('/api/control', 'stop')" class="btn btn-danger">停止服务</button>
                                    <button onclick="controlService('/api/control', 'restart')" class="btn btn-warning">重启服务</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>运行日志</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="orderAutoScroll" checked>
                            <label class="form-check-label" for="orderAutoScroll">自动滚动</label>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="order-log-container" class="log-container">正在获取日志...</div>
                    </div>
                </div>
            </div>

            <!-- Monitor Tab -->
            <div class="tab-pane fade" id="monitor" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="card shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title d-inline-block me-3">监控控制</h5>
                                    <div class="d-inline-block">
                                        <span id="monitor-status-dot" class="status-dot"></span>
                                        <span id="monitor-status-text" class="fw-bold text-muted">未知状态</span>
                                    </div>
                                </div>
                                <div class="btn-group" role="group">
                                    <button onclick="controlService('/api/monitor/control', 'start')" class="btn btn-success">启动监控</button>
                                    <button onclick="controlService('/api/monitor/control', 'stop')" class="btn btn-danger">停止监控</button>
                                    <button onclick="controlService('/api/monitor/control', 'restart')" class="btn btn-warning">重启监控</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>监控日志</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="monitorAutoScroll" checked>
                            <label class="form-check-label" for="monitorAutoScroll">自动滚动</label>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="monitor-log-container" class="log-container">正在获取日志...</div>
                    </div>
                </div>
            </div>

            <!-- Sync Tab -->
            <div class="tab-pane fade" id="sync" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="card shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title d-inline-block me-3">同步控制</h5>
                                    <div class="d-inline-block">
                                        <span id="sync-status-dot" class="status-dot"></span>
                                        <span id="sync-status-text" class="fw-bold text-muted">未知状态</span>
                                    </div>
                                </div>
                                <div class="btn-group" role="group">
                                    <button onclick="controlService('/api/sync/control', 'start')" class="btn btn-success">启动同步</button>
                                    <button onclick="controlService('/api/sync/control', 'stop')" class="btn btn-danger">停止同步</button>
                                    <button onclick="controlService('/api/sync/control', 'restart')" class="btn btn-warning">重启同步</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>同步日志</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="syncAutoScroll" checked>
                            <label class="form-check-label" for="syncAutoScroll">自动滚动</label>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="sync-log-container" class="log-container">正在获取日志...</div>
                    </div>
                </div>
            </div>

            <!-- Config Tab -->
            <div class="tab-pane fade" id="config" role="tabpanel">
                <div class="card shadow-sm h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>配置文件 (config.json)</span>
                        <button onclick="saveConfig()" class="btn btn-sm btn-primary">保存配置</button>
                    </div>
                    <div class="card-body p-0">
                        <textarea id="config-editor" class="form-control border-0" style="height: 600px; font-family: monospace; resize: none;"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        // Init
        loadConfig();
        setInterval(updateTime, 1000);
        setInterval(updateAllStatus, 2000);
        updateAllStatus();

        function updateTime() {
            const now = new Date();
            document.getElementById('sys-time').textContent = now.toLocaleTimeString();
        }

        function updateAllStatus() {
            // Update Order Status
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    updateStatusUI('order', data);
                });

            // Update Monitor Status
            fetch('/api/monitor/status')
                .then(response => response.json())
                .then(data => {
                    updateStatusUI('monitor', data);
                });

            // Update Sync Status
            fetch('/api/sync/status')
                .then(response => response.json())
                .then(data => {
                    updateStatusUI('sync', data);
                });
        }

        function updateStatusUI(prefix, data) {
            const dot = document.getElementById(prefix + '-status-dot');
            const text = document.getElementById(prefix + '-status-text');
            
            if (data.running) {
                dot.className = 'status-dot status-running';
                text.textContent = '运行中';
                text.className = 'fw-bold text-success';
            } else {
                dot.className = 'status-dot status-stopped';
                text.textContent = '已停止';
                text.className = 'fw-bold text-danger';
            }

            // Update logs
            const logContainer = document.getElementById(prefix + '-log-container');
            const isAutoScroll = document.getElementById(prefix + 'AutoScroll').checked;
            
            // Only update if content changed to avoid flickering/performance issues (simple check)
            const newContent = data.logs.join('<br>');
            if (logContainer.innerHTML !== newContent) {
                logContainer.innerHTML = newContent;
                if (isAutoScroll) {
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
            }
        }

        function controlService(endpoint, action) {
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                updateAllStatus();
            });
        }

        function loadConfig() {
            fetch('/api/config')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('config-editor').value = JSON.stringify(data, null, 4);
                });
        }

        function saveConfig() {
            try {
                const configStr = document.getElementById('config-editor').value;
                const configData = JSON.parse(configStr);
                
                fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('配置已保存！建议重启相关服务以生效。');
                    } else {
                        alert('保存失败: ' + data.message);
                    }
                });
            } catch (e) {
                alert('JSON 格式错误: ' + e);
            }
        }
    </script>
</body>
</html>
